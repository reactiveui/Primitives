name: Benchmarks A/B

on:
    workflow_dispatch:
        inputs:
            base:
                description: 'Baseline commit SHA.'
                type: string
                required: true
            head:
                description: 'Commit SHA compared against the baseline.'
                type: string
                required: true

permissions:
    contents: read

jobs:
    benchmark:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-benchmarks-ab.yml@main
        with:
            base: ${{ inputs.base }}
            head: ${{ inputs.head }}
            projects: |
                benchmarks/ReactiveUI.Primitives.Benchmarks/ReactiveUI.Primitives.Benchmarks.csproj
                benchmarks/ReactiveUI.Primitives.ObservableEvents.Benchmarks/ReactiveUI.Primitives.ObservableEvents.Benchmarks.csproj
            solutionFile: ReactiveUI.Primitives.slnx
            installWorkloads: true
