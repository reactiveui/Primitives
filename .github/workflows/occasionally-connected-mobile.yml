name: OccasionallyConnected native Mobile package

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ReactiveUI.Primitives.OccasionallyConnected*/**'
      - 'src/tests/ReactiveUI.Primitives.OccasionallyConnected.Mobile.Tests/**'
      - 'src/tests/ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests/**'
      - 'src/Directory.*'
      - '.github/workflows/occasionally-connected-mobile.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      sourceRef:
        type: string
        required: false
        default: ''
      packageVersion:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: occasionally-connected-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            heads: 'net10.0-android;net10.0-windows10.0.19041.0'
            apple: ''
            name: windows-android
          - os: macos-latest
            heads: 'net10.0-android;net10.0-ios;net10.0-maccatalyst'
            apple: 'net10.0-ios;net10.0-maccatalyst'
            name: apple-android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MOBILE_PACKAGE_VERSION: ${{ inputs.packageVersion || format('0.1.0-mobile.{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.sourceRef || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Select the supported SDK for native workloads and builds
        shell: bash
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$GITHUB_WORKSPACE/src" <<'CS'
          #:property TargetFramework=net10.0
          using System.Diagnostics;
          using System.Text.Json;
          using System.Text.Json.Nodes;

          var source = args.Single();
          var installed = await RunAsync("--list-sdks", source);
          var versions = installed.Split('\n')
              .Select(static line => line.Split(' ')[0])
              .Where(static value => value.StartsWith("10.", StringComparison.Ordinal) && Version.TryParse(value, out _))
              .OrderBy(static value => Version.Parse(value)).ToArray();
          if (versions.Length == 0) throw new InvalidOperationException("A stable .NET 10 SDK is required.");
          var version = versions[^1];
          var path = Path.Combine(source, "global.json");
          var configuration = JsonNode.Parse(await File.ReadAllTextAsync(path))
              ?? throw new InvalidOperationException("The SDK configuration is empty.");
          var sdk = configuration["sdk"]?.AsObject()
              ?? throw new InvalidOperationException("The SDK configuration is missing.");
          sdk["version"] = version;
          sdk["allowPrerelease"] = false;
          sdk["rollForward"] = "disable";
          await File.WriteAllTextAsync(path, configuration.ToJsonString(new JsonSerializerOptions { WriteIndented = true }));
          if ((await RunAsync("--version", source)).Trim() != version)
              throw new InvalidOperationException("The native job selected the wrong SDK.");

          static async Task<string> RunAsync(string argument, string directory)
          {
              var start = new ProcessStartInfo("dotnet", argument)
              {
                  WorkingDirectory = directory,
                  UseShellExecute = false,
                  RedirectStandardOutput = true,
                  RedirectStandardError = true,
              };
              using var process = Process.Start(start) ?? throw new InvalidOperationException("The SDK probe did not start.");
              var output = process.StandardOutput.ReadToEndAsync();
              var error = process.StandardError.ReadToEndAsync();
              await process.WaitForExitAsync();
              if (process.ExitCode != 0) throw new InvalidOperationException(await error);
              return await output;
          }
          CS
      - name: Install supported native workloads
        shell: bash
        working-directory: src
        run: dotnet workload install maui
      - name: Build and pack real native libraries with API checks
        shell: bash
        working-directory: src
        env:
          MOBILE_HEADS: ${{ matrix.heads }}
          APPLE_HEADS: ${{ matrix.apple }}
        run: |
          dotnet pack ReactiveUI.Primitives.OccasionallyConnected.Mobile/ReactiveUI.Primitives.OccasionallyConnected.Mobile.csproj \
            -c Release -o ../artifacts/mobile-native \
            "-p:MobilePlatformTargetFrameworks=${MOBILE_HEADS//;/%3B}" "-p:ApplePrimitivesTargetFrameworks=${APPLE_HEADS//;/%3B}" \
            -p:AndroidPrimitivesTargetFrameworks=net10.0-android -p:NetTargetFrameworks=net10.0 \
            -p:MauiTargetFrameworks=net10.0 -p:LangVersion=preview "-p:MinVerVersionOverride=$MOBILE_PACKAGE_VERSION"
      - name: Test installation recovery, path aliases, and packed native API assets
        shell: bash
        working-directory: src
        env:
          RXUI_MOBILE_NATIVE_HEADS: ${{ matrix.heads }}
        run: |
          packages=(../artifacts/mobile-native/*.nupkg)
          [[ ${#packages[@]} -eq 1 && -f "${packages[0]}" ]] || { echo 'Expected one native Mobile package.' >&2; exit 1; }
          package="$(cd ../artifacts/mobile-native && pwd)/$(basename "${packages[0]}")"
          if [[ "$RUNNER_OS" == Windows ]]; then package="$(cygpath -w "$package")"; fi
          export RXUI_MOBILE_NATIVE_PACKAGE="$package"
          export RXUI_MOBILE_PACKAGE_VERSION="$MOBILE_PACKAGE_VERSION"
          export RXUI_MOBILE_PACKAGE_COMMIT="$(git rev-parse HEAD)"
          dotnet test --project "$PWD/tests/ReactiveUI.Primitives.OccasionallyConnected.Mobile.Tests/ReactiveUI.Primitives.OccasionallyConnected.Mobile.Tests.csproj" \
            -c Release --framework net10.0 -p:NetTargetFrameworks=net10.0 -p:MauiTargetFrameworks=net10.0 \
            -p:MauiTestTargetFrameworks=net10.0 -p:MobilePlatformTargetFrameworks= -p:LangVersion=preview \
            -p:AndroidPrimitivesTargetFrameworks= -p:ApplePrimitivesTargetFrameworks=
          dotnet test --project "$PWD/tests/ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests/ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests.csproj" \
            -c Release --framework net10.0 -p:NetTargetFrameworks=net10.0 -p:LangVersion=preview \
            -p:AndroidPrimitivesTargetFrameworks= -p:ApplePrimitivesTargetFrameworks= \
            -- --treenode-filter '/*/*/SqliteLocalStoreAdapterTests/*Ownership*'
      - name: Retain native package and symbols
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-${{ matrix.name }}
          path: artifacts/mobile-native
          if-no-files-found: error

  complete-native-package:
    needs: native-mobile
    runs-on: ubuntu-latest
    env:
      MOBILE_PACKAGE_VERSION: ${{ inputs.packageVersion || format('0.1.0-mobile.{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.sourceRef || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mobile-windows-android
          path: artifacts/mobile-windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mobile-apple-android
          path: artifacts/mobile-apple
      - name: Compose and verify all native assets before release signing
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          dotnet run --project tools/OccasionallyConnected.Ci/OccasionallyConnected.Ci.csproj -- merge-mobile \
            artifacts/mobile-windows artifacts/mobile-apple artifacts/mobile-complete "$MOBILE_PACKAGE_VERSION" "$commit"
          dotnet run tools/OccasionallyConnectedPackageInspector.cs -- verify-native \
            --feed artifacts/mobile-complete --version "$MOBILE_PACKAGE_VERSION" --commit "$commit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-complete-native-package
          path: artifacts/mobile-complete
          if-no-files-found: error
