name: OccasionallyConnected crash matrix

on:
  pull_request:
    branches: [main, OccasionallyConnected]
    paths:
      - 'src/ReactiveUI.Primitives.OccasionallyConnected*/**'
      - 'src/tests/ReactiveUI.Primitives.OccasionallyConnected*/**'
      - 'src/Directory.*'
      - '.github/workflows/occasionally-connected-crash.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occasionally-connected-crash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crash-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Tests
            class: OccasionallyConnectedStreamTests
            test: WhenProcessDiesAtStreamCrashPoint_ThenReopenedStreamHonorsDurableBoundary
          - os: ubuntu-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Tests
            class: OccasionallyConnectedBuilderTests
            test: '*StrategySurvivesProcessTermination*'
          - os: ubuntu-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Transport.Http.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Transport.Http.Tests
            class: HttpRemoteTransportAdapterTests
            test: WhenProcessDiesDuringHttpPush_ThenRestartedTransportPreservesServerEffect
          - os: ubuntu-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests
            class: SqliteLocalStoreAdapterTests
            test: WhenWriterProcessDiesAtCommitCheckpoint_ThenReopenHonorsTransactionBoundary
          - os: ubuntu-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Server.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Server.Tests
            class: SqliteServerCommitJournalTests
            test: WhenServerWriterDiesAtCommitCheckpoint_ThenResendAppliesExactlyOnce
          - os: windows-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Tests
            class: OccasionallyConnectedStreamTests
            test: WhenProcessDiesAtStreamCrashPoint_ThenReopenedStreamHonorsDurableBoundary
          - os: windows-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Tests
            class: OccasionallyConnectedBuilderTests
            test: '*StrategySurvivesProcessTermination*'
          - os: windows-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Transport.Http.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Transport.Http.Tests
            class: HttpRemoteTransportAdapterTests
            test: WhenProcessDiesDuringHttpPush_ThenRestartedTransportPreservesServerEffect
          - os: windows-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests
            class: SqliteLocalStoreAdapterTests
            test: WhenWriterProcessDiesAtCommitCheckpoint_ThenReopenHonorsTransactionBoundary
          - os: windows-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Server.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Server.Tests
            class: SqliteServerCommitJournalTests
            test: WhenServerWriterDiesAtCommitCheckpoint_ThenResendAppliesExactlyOnce
          - os: macos-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Tests
            class: OccasionallyConnectedStreamTests
            test: WhenProcessDiesAtStreamCrashPoint_ThenReopenedStreamHonorsDurableBoundary
          - os: macos-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Tests
            class: OccasionallyConnectedBuilderTests
            test: '*StrategySurvivesProcessTermination*'
          - os: macos-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Transport.Http.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Transport.Http.Tests
            class: HttpRemoteTransportAdapterTests
            test: WhenProcessDiesDuringHttpPush_ThenRestartedTransportPreservesServerEffect
          - os: macos-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests
            class: SqliteLocalStoreAdapterTests
            test: WhenWriterProcessDiesAtCommitCheckpoint_ThenReopenHonorsTransactionBoundary
          - os: macos-latest
            project: ReactiveUI.Primitives.OccasionallyConnected.Server.Tests
            namespace: ReactiveUI.Primitives.OccasionallyConnected.Server.Tests
            class: SqliteServerCommitJournalTests
            test: WhenServerWriterDiesAtCommitCheckpoint_ThenResendAppliesExactlyOnce
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: Run crash matrix test
        working-directory: src
        run: >-
          dotnet test
          "tests/${{ matrix.project }}/${{ matrix.project }}.csproj"
          --configuration Release
          --framework net10.0
          -p:AndroidPrimitivesTargetFrameworks=
          -p:ApplePrimitivesTargetFrameworks=
          --
          --treenode-filter "/*/${{ matrix.namespace }}/${{ matrix.class }}/${{ matrix.test }}"
          --minimum-expected-tests 1
