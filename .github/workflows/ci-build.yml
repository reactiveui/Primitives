name: Build

on:
    push:
        branches: [ main, OccasionallyConnected ]
    pull_request:
        branches: [ main, OccasionallyConnected ]

env:
    productNamespacePrefix: "ReactiveUI.Primitives"

# Needed so the reusable workflow can optionally delete the temp per-OS artifacts it creates.
permissions:
    contents: read
    actions: write

jobs:
    build:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
        with:
            productNamespacePrefix: ReactiveUI.Primitives
            # The Uno.Sdk projects need MSBuild, so they build in their own Windows job.
            solutionFile: ReactiveUI.Primitives.slnf
            msbuildSolutionFile: ReactiveUI.Primitives.Uno.slnf
            # The Uno projects compile the WinUI sequencer source, which the WinUI tests cover; the filter has no tests.
            msbuildPerformTests: false
            installWorkloads: true
            minverMinimumMajorMinor: '0.1'
            testTimeout: '15m'
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
