name: SonarCloud

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    sonarcloud:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-sonarcloud.yml@main
        with:
            productNamespacePrefix: ReactiveUI.Primitives
            installWorkloads: true
            minverMinimumMajorMinor: '0.1'
            sonarProjectKey: reactiveui_Primitives
            sonarOrganization: reactiveui
            sonarExclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/TestResults/**'
            sonarCoverageExclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/*Tests/**,**/*Tests.cs,**/Generated/**'
            sonarCpdExclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/SyncLatest*Coordinator*.cs,**/SyncLatest*Signal*.cs,**/SyncLatest*State*.cs,**/SyncLatestWitness*.cs,**/SequencerSchedulingExtensions.cs,**/Signal*RxAliases*.cs,**/ReactiveUI.Primitives.Blazor/**,**/ReactiveUI.Primitives.Maui/**,**/ReactiveUI.Primitives.WinUI/**,**/ReactiveUI.Primitives.WinForms/**,**/ReactiveUI.Primitives.Wpf/**,**/SignalOperatorMixins.CombineLatest.cs,**/SignalOperatorMixins.SyncLatest.MultiSource.cs,**/SignalOperatorParityMixins.RxNames.cs,**/SignalOperatorParityMixins.RxNames.CombineLatest.cs'
            sonarTestExclusions: '**/tests/**,**/tools/**,**/benchmarks/**'
            testTimeout: '15m'
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
