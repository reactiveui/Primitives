name: OccasionallyConnected NativeAOT consumer

on:
  pull_request:
    branches: [main, OccasionallyConnected]
    paths:
      - 'src/ReactiveUI.Primitives.OccasionallyConnected*/**'
      - 'src/ReactiveUI.Primitives*/**'
      - 'src/ReactiveUI.Disposables/**'
      - 'src/Directory.*'
      - 'samples/OccasionallyConnected.PackedSample/**'
      - 'tools/Test-OccasionallyConnectedAot.ps1'
      - '.github/workflows/occasionally-connected-aot.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      sourceRef:
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: occasionally-connected-aot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-aot-consumer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.sourceRef || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Pack, publish, and run clean NativeAOT consumer
        shell: pwsh
        run: ./tools/Test-OccasionallyConnectedAot.ps1 -Version "0.1.0-ocaot.${{ github.run_id }}.${{ github.run_attempt }}"
      - name: Retain NativeAOT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: occasionally-connected-native-aot
          path: artifacts/oc-aot
          if-no-files-found: warn
