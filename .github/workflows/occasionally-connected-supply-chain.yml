name: OccasionallyConnected supply chain

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ReactiveUI.Primitives.OccasionallyConnected*/**'
      - 'src/Directory.*'
      - 'tools/OccasionallyConnected.Ci/**'
      - '.github/workflows/occasionally-connected-supply-chain.yml'
  workflow_dispatch:
    inputs:
      sourceRef:
        description: 'Optional git ref to scan'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      sourceRef:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.sourceRef || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: Generate SBOM and scan dependencies
        shell: bash
        run: dotnet run --project tools/OccasionallyConnected.Ci/OccasionallyConnected.Ci.csproj -- supply-chain --version "0.1.0-ocscan.${{ github.run_id }}"
      - name: Retain supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: occasionally-connected-supply-chain
          path: artifacts/oc-supply-chain
          if-no-files-found: warn
