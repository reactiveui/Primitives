name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      sourceRef:
        description: 'Optional git ref (tag/branch/SHA) to release from. Leave blank to release from this branch (normally main).'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write
  packages: read

jobs:
  check-occasionally-connected-packages:
    uses: ./.github/workflows/occasionally-connected-packages.yml
    with:
      sourceRef: ${{ inputs.sourceRef }}

  check-occasionally-connected-aot:
    uses: ./.github/workflows/occasionally-connected-aot.yml
    with:
      sourceRef: ${{ inputs.sourceRef }}

  scan-occasionally-connected:
    uses: ./.github/workflows/occasionally-connected-supply-chain.yml
    with:
      sourceRef: ${{ inputs.sourceRef }}

  release:
    needs: [check-occasionally-connected-packages, check-occasionally-connected-aot, scan-occasionally-connected]
    uses: reactiveui/actions-common/.github/workflows/workflow-common-release.yml@main
    with:
      solutionFile: ReactiveUI.Primitives.slnf
      msbuildSolutionFile: ReactiveUI.Primitives.Uno.slnf
      installWorkloads: true
      minverMinimumMajorMinor: '0.1'
      bump: ${{ inputs.bump }}
      sourceRef: ${{ inputs.sourceRef }}
    secrets:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}

  build-native-mobile:
    needs: release
    uses: ./.github/workflows/occasionally-connected-mobile.yml
    with:
      sourceRef: ${{ needs.release.outputs.sourceSha }}
      packageVersion: ${{ needs.release.outputs.semver2 }}

  sign-complete-release:
    needs: [release, build-native-mobile]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/reactiveui/certum-signer:latest@sha256:7a77f04d311a937d1a724058a845dc09107bd79937281d86a43238c3e677413b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
      MOBILE_VERSION: ${{ needs.release.outputs.semver2 }}
    steps:
      - name: Checkout release source for package inspection
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.release.outputs.sourceSha }}
          persist-credentials: false

      - name: Download unsigned release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-nuget
          path: signed-complete

      - name: Download complete native Mobile package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mobile-complete-native-package
          path: complete-mobile

      - name: Stage and verify complete native assets before signing
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sourceSha }}
        run: |
          name="ReactiveUI.Primitives.OccasionallyConnected.Mobile.${MOBILE_VERSION}"
          test -f "signed-complete/${name}.nupkg"
          test -f "complete-mobile/${name}.nupkg"
          test -f "complete-mobile/${name}.snupkg"
          mv -- "complete-mobile/${name}.nupkg" "signed-complete/${name}.nupkg"
          mv -- "complete-mobile/${name}.snupkg" "signed-complete/${name}.snupkg"
          dotnet run tools/OccasionallyConnectedPackageInspector.cs -- verify-native \
            --feed signed-complete --version "$MOBILE_VERSION" --commit "$RELEASE_SHA"

      - name: Sign the complete release package set
        uses: reactiveui/actions-common/.github/actions/certum-sign@main
        with:
          packages-glob: 'signed-complete/*.nupkg'
          timestamp-url: 'http://time.certum.pl'

      - name: Upload signed complete release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-complete
          path: |
            signed-complete/*.nupkg
            signed-complete/*.snupkg
          if-no-files-found: error

  publish-nuget:
    needs: [release, sign-complete-release]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Download signed complete release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-complete

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

      - name: NuGet login (OIDC trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: bash
        run: |
          for pkg in *.nupkg; do
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          done

  create-release:
    needs: [release, publish-nuget]
    uses: reactiveui/actions-common/.github/workflows/workflow-common-create-release.yml@main
    with:
      version: ${{ needs.release.outputs.semver2 }}
      tag: ${{ needs.release.outputs.tag }}
      target: ${{ needs.release.outputs.sourceSha }}
