name: OccasionallyConnected soak and performance

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occasionally-connected-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Soak durable queue
        working-directory: src
        run: >-
          dotnet test
          tests/ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests/ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests.csproj
          --configuration Release
          --framework net10.0
          --
          --treenode-filter "/*/*/*/OfflineOutboxSoakRecoversDrainsAndCompacts"
      - name: Soak slow observers and reconnect
        working-directory: src
        run: >-
          dotnet test
          tests/ReactiveUI.Primitives.OccasionallyConnected.Tests/ReactiveUI.Primitives.OccasionallyConnected.Tests.csproj
          --configuration Release
          --framework net10.0
          --
          --treenode-filter "/*/*/*/SlowObserverStormDisconnectsAndResubscribeRecovers"

  performance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Check durable queue performance budgets
        working-directory: src
        run: >-
          dotnet test
          tests/ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests/ReactiveUI.Primitives.OccasionallyConnected.Storage.Sqlite.Tests.csproj
          --configuration Release
          --framework net10.0
          --
          --treenode-filter "/*/*/*/DurableOutboxPerformanceStaysWithinReleaseBudgets"
