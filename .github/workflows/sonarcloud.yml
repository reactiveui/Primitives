name: SonarCloud

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

concurrency:
    group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: sonarcloud / changes
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.changes.outputs.code }}
        steps:
            - id: changes
              uses: reactiveui/actions-common/.github/actions/detect-changes@main

    sonarcloud:
        name: sonarcloud / sonarcloud
        needs: changes
        if: >-
            !cancelled() && needs.changes.outputs.code != 'false' &&
            (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: windows-latest
        timeout-minutes: 60
        env:
            DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            - name: Setup .NET environment
              id: environment
              uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
              with:
                  dotnet-versions: |
                      8.0.x
                      9.0.x
                      10.0.x
                      11.0.x
                  src-folder: src
                  solution-file: ReactiveUI.Primitives.slnf
                  install-workloads: true
                  minver-minimum-major-minor: '0.1'
            - name: SonarCloud begin
              uses: reactiveui/actions-common/.github/actions/sonarcloud@main
              with:
                  mode: begin
                  project-key: reactiveui_Primitives
                  organization: reactiveui
                  version: ${{ steps.environment.outputs.version-semver2 }}
                  working-directory: src
                  coverage-glob: '**/*.cobertura.xml,../artifacts/occasionally-connected/**/*.cobertura.xml'
                  # Keep the existing analysis policy while changing only test scheduling.
                  extra-begin-args: '/d:sonar.cpd.cs.minimumTokens=200'
                  exclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/TestResults/**'
                  coverage-exclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/*Tests/**,**/*Tests.cs,**/Generated/**'
                  cpd-exclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/Operators/SyncLatest*.cs,**/SyncLatest*Coordinator*.cs,**/SyncLatest*Signal*.cs,**/SyncLatest*State*.cs,**/SyncLatestWitness*.cs,**/SynchronizeWitness.cs,**/SynchronizeObjectWitness*.cs,**/SequencerSchedulingExtensions.cs,**/Signal*RxAliases*.cs,**/ReactiveUI.Primitives.Blazor/**,**/ReactiveUI.Primitives.Maui/**,**/ReactiveUI.Primitives.WinUI/**,**/ReactiveUI.Primitives.WinForms/**,**/ReactiveUI.Primitives.Wpf/**,**/SignalOperatorMixins.CombineLatest.cs,**/SignalOperatorMixins.SyncLatest.MultiSource.cs,**/SignalOperatorParityMixins.RxNames.cs,**/SignalOperatorParityMixins.RxNames.CombineLatest.cs,**/SignalOperatorMixins.CombineLatest.WideArity.cs,**/SignalOperatorMixins.SyncLatest.WideArity.cs,**/SignalOperatorParityMixins.RxNames.CombineLatest.WideArity.cs'
                  test-exclusions: '**/tests/**,**/tools/**,**/benchmarks/**'
            - name: Build all targets
              uses: reactiveui/actions-common/.github/actions/dotnet-build@main
              with:
                  configuration: Release
                  src-folder: src
                  solution-file: ReactiveUI.Primitives.slnf
                  create-packages: 'false'
            - name: Test other suites on all supported targets
              uses: reactiveui/actions-common/.github/actions/dotnet-test@main
              with:
                  configuration: Release
                  src-folder: src
                  solution-file: ReactiveUI.Primitives.slnf
                  enable-detailed-test-logging: false
                  test-timeout: '15m'
                  test-projects: |
                      tests/**/*.csproj
                      !tests/ReactiveUI.Primitives.OccasionallyConnected*/*.csproj
            # The required feature matrix tests every supported TFM on all three OSes.
            # Run all feature suites once here to collect complete source coverage for Sonar.
            - name: Verify complete feature coverage
              shell: bash
              run: dotnet run --project tools/OccasionallyConnected.Ci/OccasionallyConnected.Ci.csproj -- coverage --framework net10.0 --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-os "$RUNNER_OS"
            - name: SonarCloud end
              if: always()
              uses: reactiveui/actions-common/.github/actions/sonarcloud@main
              with:
                  mode: end
                  project-key: reactiveui_Primitives
                  working-directory: src
