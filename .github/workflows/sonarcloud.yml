name: SonarCloud

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
    contents: read

jobs:
    sonarcloud-token:
        name: validate-token
        runs-on: ubuntu-latest
        outputs:
            available: ${{ steps.check.outputs.available }}
        steps:
            - name: Check SonarCloud token
              id: check
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: |
                  if [ -n "${SONAR_TOKEN:-}" ]; then
                    echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "available=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::SONAR_TOKEN is not configured; skipping SonarCloud analysis for this run."
                  fi

    sonarcloud:
        needs: sonarcloud-token
        if: ${{ needs.sonarcloud-token.outputs.available == 'true' }}
        uses: reactiveui/actions-common/.github/workflows/workflow-common-sonarcloud.yml@main
        with:
            productNamespacePrefix: ReactiveUI.Primitives
            installWorkloads: true
            minverMinimumMajorMinor: '0.1'
            sonarProjectKey: reactiveui_Primitives
            sonarOrganization: reactiveui
            sonarExclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/TestResults/**'
            sonarCoverageExclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/*Tests/**,**/*Tests.cs,**/Generated/**,**/ReactiveUI.Primitives.Blazor/**,**/ReactiveUI.Primitives.Maui/**,**/ReactiveUI.Primitives.WinUI/**,**/ReactiveUI.Primitives.WinForms/**,**/ReactiveUI.Primitives.Wpf/**,**/ReactiveUI.Primitives/Concurrency/DispatchSequencerBase.cs,**/ReactiveUI.Primitives/Concurrency/Sequencer.Simple.cs,**/ReactiveUI.Primitives/Concurrency/SynchronizationContextSequencer.cs,**/ReactiveUI.Primitives/Concurrency/TaskPoolSequencer.cs,**/ReactiveUI.Primitives/Concurrency/ThreadPoolSequencer.cs,**/ReactiveUI.Primitives/Core/Witness.cs,**/ReactiveUI.Primitives/Signal/CommandExecution*.cs,**/ReactiveUI.Primitives/Signal/CommandSignal*.cs,**/ReactiveUI.Primitives/Signal/ProjectedReadOnlyState*.cs,**/ReactiveUI.Primitives/SignalOperatorMixins.cs,**/ReactiveUI.Primitives/Signals/Core/CreateSignal*.cs,**/ReactiveUI.Primitives/Signals/Core/LoopSignal*.cs,**/ReactiveUI.Primitives/Signals/Core/UnfoldSignal*.cs,**/ReactiveUI.Primitives/Signals/Core/UseSignal*.cs,**/ReactiveUI.Primitives/Signals/Signal*FromTask*.cs'
            sonarCpdExclusions: '**/tests/**,**/tools/**,**/benchmarks/**,**/CombineLatest?.cs,**/CombineLatest??.cs,**/ReactiveUI.Primitives.Blazor/**,**/ReactiveUI.Primitives.Maui/**,**/ReactiveUI.Primitives.WinUI/**,**/ReactiveUI.Primitives.WinForms/**,**/ReactiveUI.Primitives.Wpf/**'
            sonarTestExclusions: '**/tests/**,**/tools/**,**/benchmarks/**'
            testTimeout: '15m'
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
