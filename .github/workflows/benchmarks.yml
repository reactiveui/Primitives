name: Benchmarks

on:
    workflow_dispatch:
        inputs:
            sha:
                description: 'Commit to benchmark. Empty benchmarks the latest commit of the chosen branch.'
                type: string
                default: ''

permissions:
    contents: read

jobs:
    benchmark:
        uses: reactiveui/actions-common/.github/workflows/workflow-common-benchmarks.yml@main
        with:
            revision: ${{ inputs.sha }}
            projects: |
                benchmarks/ReactiveUI.Primitives.Benchmarks/ReactiveUI.Primitives.Benchmarks.csproj
                benchmarks/ReactiveUI.Primitives.ObservableEvents.Benchmarks/ReactiveUI.Primitives.ObservableEvents.Benchmarks.csproj
            solutionFile: ReactiveUI.Primitives.slnx
            installWorkloads: true
